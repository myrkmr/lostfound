name: Java CI with Maven, Docker, SonarCloud and Coveralls

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JDK_JAVA_OPTIONS: --add-opens=java.base/java.util=ALL-UNNAMED
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-sonar-
      - name: Verify tests and 100 percent coverage
        run: xvfb-run --auto-servernum mvn -B verify -Pjacoco
      - name: Verify 100 percent mutation strength
        run: xvfb-run --auto-servernum mvn -B test -Ppit
      - name: Analyze with SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >-
          mvn -B sonar:sonar
          -Dsonar.organization=myrkmr
          -Dsonar.projectKey=myrkmr_lostfound
          -Dsonar.token=${SONAR_TOKEN}
      - name: Report coverage to Coveralls
        if: ${{ env.COVERALLS_REPO_TOKEN != '' }}
        run: mvn -B coveralls:report -Pcoveralls
